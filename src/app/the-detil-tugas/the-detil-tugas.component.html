<div class="product-container">
  <div class="label-product">{{selectedBrandName}}  {{modelname}}</div>
  <div class="anakan-label">{{ sampleData?.unit_location == null ? 'Tribik' : sampleData?.unit_location }}&#x25CF; {{tgl_mobilisasi | date:'dd MMMM yyyy'}}</div>

    <mat-accordion multi>
        <mat-expansion-panel [expanded]="true" id="Info Vendor" >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <b>Info Vendor</b>
            </mat-panel-title>
            <mat-panel-description>
              <!-- Informasi Vendor 1 -->
            </mat-panel-description>
          </mat-expansion-panel-header>
            <div class="row">
                <div class="column">
                    <label for="vendorName">Nama Vendor</label>
                    <input id="vendorName" type="text" placeholder="Nama Vendor" value="{{sampleDataVendor?.vendor_name}}" style="border:1px;line-height: 10px;text-transform: uppercase;" readonly/>
                    
                    <label for="vendorAddress">Lokasi Unit</label>
                    <select *ngIf="isMandiriTunasFinance" 
                            #auctionHouseSelect 
                            id="vendorAddress" 
                            class="form-control auction-house-select"
                            [(ngModel)]="selectedLokasiUnit"
                            (change)="onLokasiUnitChange($event)"
                            style="text-transform: uppercase;">
                      <option value="">Pilih Lokasi Balai Lelang</option>
                      <option *ngFor="let house of auctionHouses" [value]="house">{{house}}</option>
                    </select>
                    <input *ngIf="!isMandiriTunasFinance" 
                           id="vendorAddress" 
                           type="text" 
                           placeholder="Lokasi Unit" 
                           [(ngModel)]="selectedLokasiUnit" 
                           style="border:1px;line-height: 10px;text-transform: uppercase;" 
                           (change)="onLokasiUnitChange($event)"/>
                    <!-- <input id="vendorAddress" type="text" placeholder="Alamat" value="{{sampleDataVendor?.address}}, {{sampleDataVendor?.city}}, {{sampleDataVendor?.province}}" style="border:0px;line-height: 10px;" readonly/> -->
                    <!-- <textarea id="vendorAddress" placeholder="Alamat" rows="6" readonly  style="border:0px;line-height: 10px;" >
                      {{sampleDataVendor?.address}}, {{sampleDataVendor?.city}}, {{sampleDataVendor?.province}}
                    </textarea> -->
                    
                   
                </div>
                <div class="column">
                    <label for="pic">PIC Pengirim</label>
                    <input id="pic" type="text" placeholder="PIC Pengirim"  style="border:0px;line-height: 10px;text-transform: uppercase;" [(ngModel)]="selectedPicSender" (change)="onSenderChange($event)"/>
                    
                    <label for="deliveryDate">Tanggal Pengiriman</label>
                    <input id="deliveryDate" type="text" readonly value=""  style="border:0px;line-height: 10px;text-transform: uppercase;" value="{{tgl_mobilisasi}}" />

                    <label for="vendorPhone">No. Telepon</label>
                    <input id="vendorPhone" type="text" placeholder="No Telp" [(ngModel)]="selectedPicPhoneSender"  style="border:0px;line-height: 10px;text-transform: uppercase;"  (change)="onPicPhoneChange($event)"/>
                </div>
            </div>
        </mat-expansion-panel>
      
        <mat-expansion-panel [expanded]="true" id="Info Kendaraan" >
            <mat-expansion-panel-header>
                <mat-panel-title>
                    <b>Info Kendaraan</b>
                </mat-panel-title>
                <mat-panel-description>
                    <!-- Informasi Kendaraan -->
                </mat-panel-description>
            </mat-expansion-panel-header>
            <div class="row">
              
                <div class="column">
                    <label for="expedition">Ekspedisi</label>

                    <select id="expedition" name="expedition" [(ngModel)]="selectedExpedition" (change)="onExpeditionChange($event)" >
                      <option *ngFor="let choice of choices" 
                              [value]="choice[0]">
                        {{ choice[1] }}
                      </option>
                    </select>

                    <label for="licensePlate">Nomor Polisi</label>
                    <div *ngIf="isHeavyEquipment; else normalPlate" style="width: 90%;">
                      <input
                        type="text"
                        placeholder="Nomor Polisi"
                        [(ngModel)]="licensePlateHeavyEquipment"
                        (input)="onHeavyEquipmentPlateInput($event)"
                        (blur)="onHeavyEquipmentPlateInput($event)"
                        style="text-transform: uppercase; width: 100%; font-weight: bold; letter-spacing: 2px;"/>
                    </div>
                    <ng-template #normalPlate>
                      <div style="display: flex; gap: 8px; width: 90%;">
                        <input
                          #platePart1
                          type="text"
                          placeholder="XX"
                          maxlength="2"
                          [(ngModel)]="licensePlatePart1"
                          (input)="onLicensePlateInput($event, 1, platePart2)"
                          (paste)="onLicensePlatePaste($event)"
                          style="text-transform: uppercase; width: 60px; text-align: center; font-weight: bold; letter-spacing: 2px;"/>
                        <input
                          #platePart2
                          type="text"
                          placeholder="XXXX"
                          maxlength="4"
                          [(ngModel)]="licensePlatePart2"
                          (input)="onLicensePlateInput($event, 2, platePart3)"
                          style="text-align: center; width: 80px; font-weight: bold; letter-spacing: 2px;"/>
                        <input
                          #platePart3
                          type="text"
                          placeholder="XXX"
                          maxlength="3"
                          [(ngModel)]="licensePlatePart3"
                          (input)="onLicensePlateInput($event, 3, null)"
                          style="text-transform: uppercase; width: 70px; text-align: center; font-weight: bold; letter-spacing: 2px;"/>
                      </div>
                    </ng-template>

                    <label for="unit_location">Status Unit</label>
                    <input type="text" id="unit_location" placeholder="Status Unit" value="{{HiLocation}}" readonly style="text-transform: uppercase;"/>





                    
                    

                    <label for="color"  style="display: none;">Tahun</label>
                    <input type="text" id="tahun" placeholder="Tahun"  [(ngModel)]="selectedYear"  (keyup)="onChangeTextInput($event, 0)"  style="display: none;"/>

                    <label for="noka">Noka</label>
                    <input type="text" id="noka" placeholder="Noka" [(ngModel)]="selectedNoka" (input)="onAlphanumericInput($event, 'noka')" (blur)="onChangeTextInput($event, 3)" style="text-transform: uppercase;"/>
                    
                    <label for="nosin">Nosin</label>
                    <input type="text" id="nosin" placeholder="Nosin" [(ngModel)]="selectedNosin" (input)="onAlphanumericInput($event, 'nosin')" (blur)="onChangeTextInput($event, 4)" style="text-transform: uppercase;"/>



                    <label for="color">Warna</label>

                    <select id="warna" name="warna" placeholder="Pilih Warna" [(ngModel)]="selectedColor" (change)="onColorChange($event)">
                      <option *ngFor="let color of colors?.results"
                              [value]="color.id"
                              [attr.color-id]="color.id">
                        {{ color.color_name }}
                      </option>
                    </select>

                    

                    <label for="fuel-id">Bahan Bakar</label>
                    <select id="fuel-id" [(ngModel)]="selectedFuel" name="fuel" placeholder="Pilih Fuel" (change)="onFuelChange($event)">
                      <option *ngFor="let option of fuelOptions" [value]="option">
                        {{ option }}
                      </option>
                    </select>

                    <label>Transmisi</label>

                    <select id="transmission" name="transmission" placeholder="Pilih Transmisi" [(ngModel)]="selectedTransmission" (change)="onTransmissionChange($event)">
                      <option *ngFor="let choice of transmissionOptions" 
                              [value]="choice[0]" 
                              [attr.transmission-id]="choice[0]">
                        {{ choice[1] }}
                      </option>
                    </select>

                </div>

                <div class="column">
                    <label for="category">Tipe Unit</label>
                    
                    <select id="category" name="category" placeholder="Pilih Tipe" [(ngModel)]="selectedVehicType" (change)="onVehicTypeChange($event)">
                      <option *ngFor="let vehictype of vehicletype?.results"
                              [value]="vehictype.id"
                              [attr.data-id]="vehictype.id"
                              [attr.data-name]="vehictype.type_name">
                        {{ vehictype.type_name }}
                      </option>
                    </select>

                    <label for="category">Kategori</label>
                    <button type="button" (click)="openUnitCategory()" style="text-align:left;padding-left:10px;height:45px;width:90%;border:solid #cdcdcd 1px;border-radius:8px;margin-bottom:15px;">{{ selectedUcatName || 'Pilih Kategori' }}</button>

                    <app-the-ucat-modal  
                    *ngIf="isUcatModalOpen"  
                    [brands]="unitcategory?.results || []" 
                    (close)="isUcatModalOpen = false" 
                    (selectBrand)="onUcatSelected($event)">
                    </app-the-ucat-modal>

                    <label for="brand">Merek</label>


                    <button type="button" (click)="openBrandModal()" style="text-align:left;padding-left:10px;height:45px;width:90%;border:solid #cdcdcd 1px;border-radius:8px;margin-bottom:15px;">{{ selectedBrandName || 'Pilih Merek' }}</button>

                    <app-the-brand-modal  
                    *ngIf="isBrandModalOpen"  
                    [brands]="brands?.results || []" 
                    (close)="isBrandModalOpen = false" 
                    (selectBrand)="onBrandSelected($event)">
                    </app-the-brand-modal>

                    <label for="tipe">Tipe</label>
                    
                    <input type="hidden" id="tipe" name="tipe" >
                    <button  type="button" (click)="openTipeModal()" style="text-align:left;padding-left:10px;height:45px;width:90%;border:solid #cdcdcd 1px;border-radius:8px;margin-bottom:15px;">{{ selectedVariantName || 'Pilih Tipe' }}</button>

                  <app-the-tipe-modal
                  *ngIf="isTipeModalOpen"
                  [variants]="variants?.results || []"
                  [selectedVariantName]="selectedVariantName"
                  (close)="isTipeModalOpen = false"
                  (selectVariant)="onVariantSelected($event)">
                  </app-the-tipe-modal>


                    <label for="engineCapacity"  style="display: none;">Kapasitas Mesin (CC)</label>
                    <input type="text" id="engineCapacity" placeholder="Kapasitas Mesin" value="{{sampleData?.cc}}"  (keyup)="onChangeTextInput($event, 2)"  style="display: none;"/>
                    
                    <label for="engineCapacity">Kilometer (ODO)</label>
                    <input
                    type="text"
                    id="odo_meter" placeholder="Kilometer"
                    [value]="formatNumber(selectedOdo)"
                    (input)="onNumberInput($event, 'selectedOdo')"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="8"
                  />

                    

                   
                    
                    <label for="tglstnk">STNK</label>
                    <div style="display: flex; gap: 10px; align-items: flex-start; width: 90%;">
                      <select id="tglstnk"  name="tglstnk" placeholder="STNK" (change)="onCheckedStnk($event)" style="flex: 1;">
                        <option *ngFor="let option of adaTidakOptions" 
                                [value]="option"
                                [attr.selected]="option === selectedStnkStatus ? '' : null">
                          {{ option }}
                        </option>
                      </select>
                      

                      <!-- [max]="todayDateString" -->

                      <input 
                        *ngIf="selectedStnkStatus === 'Ada'" 
                        type="date" 
                        id="tglStnkDate" 
                        name="tglStnkDate" 
                        [(ngModel)]="stnkDateString"
                        (change)="onStnkChange($event)"
                        required
                        style="flex: 1; padding: 12px; border: 1px solid #D4D2D2; border-radius: 8px;"
                      />
                    </div>

                    <label for="tglkeur">Keur</label>
                    <div style="display: flex; gap: 10px; align-items: flex-start; width: 90%;">
                      <select id="tglkeur"  name="tglkeur" placeholder="KEUR" (change)="onCheckedKeur($event)" style="flex: 1;">
                        <option *ngFor="let option of adaTidakOptions" 
                                [value]="option"
                                [attr.selected]="option === selectedKeurStatus ? '' : null">
                          {{ option }}
                        </option>
                      </select>
                      
                      <!-- [max]="todayDateString" -->
                      <input 
                        *ngIf="selectedKeurStatus === 'Ada'" 
                        type="date" 
                        id="tglKeurDate" 
                        name="tglKeurDate" 
                        [(ngModel)]="keurDateString"
                        (change)="onKeurChange($event)"
                        required
                        style="flex: 1; padding: 12px; border: 1px solid #D4D2D2; border-radius: 8px;"
                      />
                    </div>

                </div>
            </div>
        </mat-expansion-panel>
        
        <mat-expansion-panel [expanded]="true" id="Dokumen dan Kelengkapan Lainnya" >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <b>Dokumen dan Kelengkapan Lainnya</b>
            </mat-panel-title>
            <mat-panel-description>
              <!-- Informasi Vendor 2 -->
            </mat-panel-description>
          </mat-expansion-panel-header>
          <div class="row"  style="display: none;">
            <div class="column">Jenis Surat</div>
          </div>
          <div class="row"  style="display: none;">
            <div class="column">
                <div class="radio-group">
                    <label>
                        <input  type="radio" class="custom-radio" name="transmission" value="automatic" [checked]="sampleData?.transmission !== 'MT'" />
                        Automatic
                    </label>
                    <label>
                        <input type="radio" class="custom-radio" name="transmission" value="manual" [checked]="sampleData?.transmission === 'MT'" />
                        Manual
                    </label>
                </div>
            </div>
            <div class="column">
                <label for="tglpembuatan">Tanggal Masuk</label>
                <input type="date"  id="tglpembuatan" class="full-width" placeholder="Tanggal Pembuatan" [value]="sampleData?.mobilization_unit?.[0]?.mobilization?.assignment_date | date:'yyyy-MM-dd'"  (change)="onChangeTextInput($event, 5)"/>
            </div>
            <div class="column">
                <label for="suratkuasa">No Surat Kuasa Penugasan</label>
                <input  type="text" id="suratkuasa" class="full-width" placeholder="No Surat Kuasa"  [value]="assignment_number"  (change)="onChangeTextInput($event, 6)"/>
            </div>
            <div class="column"></div>
          </div>

          <div class="row">
            <div class="column"  style="display: none;">
              <!-- [disabled]="!bpkbDocuments" -->
              <button 
                [ngClass]="{'button-upl-view': bpkbDocuments.length > 0, 'button-upl-now': bpkbDocuments.length == 0}" (click)="openGallery('BPKB')"
                >
                {{bpkbDocuments.length > 0 ? 'Foto BPKB' : 'Upload Foto BPKB'}}
                <span 
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                  <mat-icon>{{bpkbDocuments.length > 0 ? 'visibility' : 'upload'}}</mat-icon>
                </span>
              </button>
            </div>

            <div class="column" >
              <!-- [disabled]="!ktpDocuments" -->
              <button 
                [ngClass]="{'button-upl-view': ktpDocuments.length > 0, 'button-upl-now': ktpDocuments.length == 0}" (click)="openGallery('KTP')"
                >
                {{ktpDocuments.length > 0 ? 'Foto KTP' : 'Upload Foto KTP'}}
                <span 
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                  <mat-icon>{{ktpDocuments.length > 0 ? 'visibility' : 'upload'}}</mat-icon>
                </span>
              </button>
            </div>
            <div class="column">
              <!-- [disabled]="!stnkDocuments" -->
                <button 
                [ngClass]="{'button-upl-view': stnkDocuments.length > 0, 'button-upl-now': stnkDocuments.length == 0}" (click)="openGallery('STNK')"
                >
                {{stnkDocuments.length > 0 ? 'Foto STNK' : 'Upload Foto STNK'}}
                <span 
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                  <mat-icon>{{stnkDocuments.length > 0 ? 'visibility' : 'upload'}}</mat-icon>
                </span>
              </button>
            </div>
            <div class="column">
              <!-- [disabled]="!sampleData?.fotoSuratKuasa"  -->
                <button 
                [ngClass]="{'button-upl-view': suratKuasaDocuments.length > 0, 'button-upl-now': suratKuasaDocuments.length == 0}" (click)="openGallery('SURATKUASA')"
                >
                {{suratKuasaDocuments.length > 0 ? 'Foto Surat Kuasa' : 'Upload Foto Surat Kuasa'}}
                <span 
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                  <mat-icon>{{suratKuasaDocuments.length > 0 ? 'visibility' : 'upload'}}</mat-icon>
                </span>
              </button>
            </div>
            <div class="column">
              <!-- [disabled]="!sampleData?.fotoBastk" -->
                <button 
                [ngClass]="{'button-upl-view': bastkVendorDocuments.length > 0, 'button-upl-now': bastkVendorDocuments.length == 0}" (click)="openGallery('BASTK')"
                >
                {{bastkVendorDocuments.length > 0 ? 'Foto BASTK Vendor' : 'Upload Foto BASTK Vendor'}}
                <span 
                  style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                  <mat-icon>{{bastkVendorDocuments.length > 0 ? 'visibility' : 'upload'}}</mat-icon>
                </span>
              </button>
            </div>
          </div>

          <div class="row" style="display: none;">
                <div class="column">Status BPKB</div>
           </div>
          <div class="row" style="display: none;">
                <div class="column">
                    <div class="radio-group">
                      <label style="display: flex; align-items: center; gap: 15px; font-size: 14px; margin-left:10px;">
                            <input type="radio"  class="custom-radio"  name="bpkb" value="automatic" [checked]="sampleData?.bpkb_status === 'TRIBIK'" (click)="onChangeTextInput($event, 7)"/>
                            Tribik
                        </label>
                        <label style="display: flex; align-items: center; gap: 15px; font-size: 14px; margin-left:10px;">
                            <input type="radio"  class="custom-radio"  name="bpkb" value="manual" [checked]="sampleData?.bpkb_status === 'VENDOR'" (click)="onChangeTextInput($event, 8)"/>
                            Vendor
                        </label>
                    </div>
                </div>
            </div>



          
        </mat-expansion-panel>
    
        <mat-expansion-panel [expanded]="true" id="Keterangan Lainnya" >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <b>Keterangan Lainnya</b>
            </mat-panel-title>
            <mat-panel-description>
              <!-- Informasi Vendor 2 -->
            </mat-panel-description>
          </mat-expansion-panel-header>
          <textarea id="notes" name="notes" cols="120" rows="10" [(ngModel)]="notes" [value]="sampleData?.notes"
            (keyup)="onChangeTextInput($event, 9)"  style="text-transform: uppercase;"></textarea>
        </mat-expansion-panel>
    
    
    
    </mat-accordion>


</div>

<!-- Modal Alert untuk Validasi Lokasi Unit -->
<app-the-modal
  [isOpen]="isLocationAlertOpen"
  [message]="'Lokasi Unit Belum Diisi'"
  [message2]="'Silakan isi lokasi unit terlebih dahulu sebelum melanjutkan.'"
  [imageUrl]="'../../assets/icons/alert-circle.svg'"
  [showButtonNope]="false"
  [showButtonYeah]="true"
  (close)="closeLocationAlert()">
</app-the-modal>
